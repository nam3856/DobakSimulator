name: Check and deploy Pages
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npm test -- --exclude tests/ability-optimizer.test.ts
      - name: Run optimizer performance tests without competing workers
        run: npm test -- tests/ability-optimizer.test.ts --no-file-parallelism
      - name: Build for browser tests
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build with production API override
        if: ${{ vars.VITE_CHARACTER_API_URL != '' }}
        run: npm run build
        env:
          VITE_CHARACTER_API_URL: ${{ vars.VITE_CHARACTER_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
