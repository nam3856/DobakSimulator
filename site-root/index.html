      * {

      }

      body {
        min-width: 280px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background:

      header,

      .wordmark {

        gap: 11px;
        color: #b9cbb8;

        font-weight: 650;
        letter-spacing: 0.07em;
      }

      .wordmark::before {
        width: 7px;
        height: 7px;
        border-radius: 2px;
        background: #d3a469;
        transform: rotate(45deg);
        content: '';
      }

      main {
        width: min(100%, 800px);
        margin: auto;
        padding: 48px 24px 72px;

      }

      .brand-icon {
        display: block;

        border-radius: 25px;

      .eyebrow {
        margin: 0 0 16px;
        color: #cdb991;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.13em;
        line-height: 1.6;
      }

      h1 {
        margin: 0;
        font-size: clamp(44px, 8vw, 68px);
        font-weight: 800;
        letter-spacing: -0.065em;
        line-height: 1.16;
      }

      .tagline {
        margin: 27px 0 0;
        color: #d4dfcc;
        font-size: clamp(19px, 3.2vw, 24px);
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 1.6;
        word-break: keep-all;
      }

      .description {
        margin: 15px 0 0;
        color: #92a895;
        font-size: 15px;
        letter-spacing: -0.025em;
        line-height: 1.9;
        word-break: keep-all;
      }

      .enter {
        display: inline-flex;
        min-height: 56px;
        margin-top: 36px;
        padding: 0 28px;
        align-items: center;
        justify-content: center;
        gap: 28px;
        border: 1px solid #f1d7a799;
        border-radius: 12px;
        background: #e4c48d;
        box-shadow: 0 8px 32px #0003;
        color: #182a1d;
        font-size: 16px;
        font-weight: 750;
        text-decoration: none;
        transition:
          background 160ms ease,
          transform 160ms ease;
      }

      .enter:hover {
        background: #f0d5a6;
        transform: translateY(-2px);
      }

      .enter:focus-visible {
        outline: 3px solid #f5efd6;
        outline-offset: 5px;
      }

      .enter svg {
        width: 18px;
        height: 18px;
      }

      .features {
        margin: 31px 0 0;
        color: #96aa96;
        font-size: 12px;
        letter-spacing: 0.01em;
        line-height: 2;
        word-break: keep-all;

        font-size: 11px;
        letter-spacing: 0.04em;
        text-align: center;
      }
